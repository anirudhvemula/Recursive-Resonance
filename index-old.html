<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Recursive Resonance</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      margin: 0;
      background: black;
      color: #aaa;
      font-family: system-ui, sans-serif;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      margin: auto;
      image-rendering: pixelated;
    }

    .label {
      position: fixed;
      bottom: 12px;
      left: 12px;
      font-size: 12px;
      opacity: 0.6;
    }

    #startBtn {
    position: fixed;
    z-index: 10;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    background: rgba(0, 0, 0, 0.6);
    color: #9feaff;
    border: 1px solid #2aa;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    }

  #startBtn:hover {
    background: rgba(0, 0, 0, 0.8);
    }

    canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  }

  #glcanvas {
    z-index: 0;
  }

  #overlay {
    z-index: 1;
    pointer-events: none;
  }

  #fractalType {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 20;

  background: rgba(0, 0, 0, 0.6);
  color: #9feaff;
  border: 1px solid #2aa;
  padding: 6px 10px;
  font-size: 13px;
  }



  </style>
</head>
<body>
  <select id="fractalType">
    <option value="mandelbrot">Mandelbrot</option>
    <option value="julia">Julia</option>
    <option value="burningship">Burning Ship</option>
  </select>



  <button id="startBtn">Start Jamming! 🔊</button>
  <canvas id="glcanvas"></canvas>
  <!-- <script type="module" src="webglFractal.js"></script> -->
  <canvas id="overlay"></canvas>

  <div class="label">Recursive Resonance — Fractal Engine</div>

  <!-- IMPORTANT: type="module" -->
  <script type="module" src="./main.js"></script>

</body>
</html>
